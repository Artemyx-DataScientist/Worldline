[workspace]
members = [
    "crates/worldline-kernel",
    "crates/worldline-demo",
    "crates/worldline-reference",
    "crates/worldline-storage",
    "crates/worldline-plugin-protocol",
    "crates/worldline-native-host",
    "crates/worldline-wasm-host",
    "crates/worldline-reference-external",
    "crates/worldline-browser-contract",
    "crates/worldline-browser-spike",
    "crates/worldline-browser-provider",
    "crates/worldline-browser-provider-process",
    "crates/worldline-browser-cef",
    "crates/worldline-browser-adblock",
    "crates/worldline-browser-services-contract",
    "crates/worldline-browser-tabs",
    "crates/worldline-browser-history",
    "crates/worldline-browser-downloads",
    "crates/worldline-browser-cookies",
]
exclude = ["crates/worldline-wasm-host/tests/components"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
