name: Worldline master CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.98.0

jobs:
  source:
    name: Source
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Bootstrap toolchain
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/Initialize-WorldlineCi.ps1
      - name: Run Source suite
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/Invoke-WorldlineCi.ps1 -Suite Source

  correctness:
    name: Correctness
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Bootstrap toolchain
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/Initialize-WorldlineCi.ps1
      - name: Run Correctness suite
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/Invoke-WorldlineCi.ps1 -Suite Correctness

  real-chromium:
    name: Real-Chromium
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Bootstrap toolchain
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/Initialize-WorldlineCi.ps1
      - name: Run Real Chromium suite
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/Invoke-WorldlineCi.ps1 -Suite RealChromium

  architecture-security:
    name: Architecture-Security
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Bootstrap toolchain
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/Initialize-WorldlineCi.ps1
      - name: Run Architecture-Security suite
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/Invoke-WorldlineCi.ps1 -Suite ArchitectureSecurity

  browser-services:
    name: Browser-Services
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Bootstrap toolchain
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/Initialize-WorldlineCi.ps1
      - name: Run Browser-Services suite
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/Invoke-WorldlineCi.ps1 -Suite BrowserServices

  proving-slice:
    name: Proving-Slice
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Bootstrap toolchain
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/Initialize-WorldlineCi.ps1
      - name: Run Proving-Slice suite
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/Invoke-WorldlineCi.ps1 -Suite ProvingSlice

