[package]
name = "worldline-browser-spike"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Browser engine spike, multi-process supervisor, and capability provider for Worldline M1.1"

[features]
default = []
real-chromium = []

[[test]]
name = "real_chromium_acceptance"
path = "tests/real_chromium_acceptance.rs"
required-features = ["real-chromium"]

[dependencies]
worldline-browser-contract = { path = "../worldline-browser-contract" }
worldline-kernel = { path = "../worldline-kernel" }
worldline-plugin-protocol = { path = "../worldline-plugin-protocol" }
worldline-storage = { path = "../worldline-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
