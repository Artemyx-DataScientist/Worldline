[package]
name = "worldline-browser-cef"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Chromium Embedded Framework (CEF) backend adapter and thread-affine loop for Worldline browser provider"

[dependencies]
worldline-browser-provider = { path = "../worldline-browser-provider" }
worldline-browser-contract = { path = "../worldline-browser-contract" }
worldline-plugin-protocol = { path = "../worldline-plugin-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"

[target.'cfg(windows)'.dependencies]
cef = { version = "=151.8.0", default-features = true, features = ["sandbox", "resources"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
] }
