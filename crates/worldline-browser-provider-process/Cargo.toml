[package]
name = "worldline-browser-provider-process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Supervised native process binary for browser provider external plugin boundary"

[lib]
name = "worldline_browser_provider_client"
crate-type = ["rlib", "cdylib"]

[dependencies]
worldline-browser-provider = { path = "../worldline-browser-provider" }
worldline-browser-contract = { path = "../worldline-browser-contract" }
worldline-plugin-protocol = { path = "../worldline-plugin-protocol" }
worldline-native-host = { path = "../worldline-native-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
worldline-browser-cef = { path = "../worldline-browser-cef" }

[[bin]]
name = "worldline-browser-provider-process"
path = "src/main.rs"
