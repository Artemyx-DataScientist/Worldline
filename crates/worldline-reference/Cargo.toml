[package]
name = "worldline-reference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Reference browser-like, agent-like, and UI-like plugins for Worldline boundary proofs"

[dependencies]
worldline-kernel = { path = "../worldline-kernel" }
worldline-storage = { path = "../worldline-storage" }
worldline-browser-contract = { path = "../worldline-browser-contract" }
worldline-browser-provider = { path = "../worldline-browser-provider" }
worldline-browser-cef = { path = "../worldline-browser-cef" }
worldline-browser-services-contract = { path = "../worldline-browser-services-contract" }
worldline-browser-tabs = { path = "../worldline-browser-tabs" }
worldline-browser-history = { path = "../worldline-browser-history" }
worldline-browser-downloads = { path = "../worldline-browser-downloads" }
worldline-browser-cookies = { path = "../worldline-browser-cookies" }
worldline-native-host = { path = "../worldline-native-host" }
worldline-plugin-protocol = { path = "../worldline-plugin-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
